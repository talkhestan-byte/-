
name: Build and Sign Farhan Castle APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web app
        run: |
          set -e
          mkdir -p www

          # کپی فایل اصلی بازی و تصویر صفحه شروع
          cp index.html www/
          cp icon-only.png www/

          # کپی تمام فایل‌های صوتی بازی
          cp start.mp3 www/
          cp win.mp3 www/
          cp lose.mp3 www/

          # بررسی وجود فایل‌ها پیش از ساخت APK
          test -s www/index.html
          test -s www/icon-only.png
          test -s www/start.mp3
          test -s www/win.mp3
          test -s www/lose.mp3

          echo "All game files copied successfully:"
          ls -lh www/

          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6

      - name: Configure Capacitor
        run: |
          npx cap init "Farhan Castle" com.yourname.farhancastle --web-dir www
          npx cap add android

          # اجبار برنامه به حالت عمودی
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

          # تنظیم دسترسی منابع محلی
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          npx cap sync android

      - name: Install Capacitor Assets
        run: npm install --save-dev @capacitor/assets

      - name: Generate App Icons
        run: npx capacitor-assets generate --android

      - name: Sync Assets to Android
        run: npx cap sync android

      - name: Verify packaged web files
        run: |
          set -e
          test -s www/index.html
          test -s www/icon-only.png
          test -s www/start.mp3
          test -s www/win.mp3
          test -s www/lose.mp3

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate Standard Keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias my-key-alias \
            -storepass 'Kabab123!' \
            -keypass 'Kabab123!' \
            -dname "CN=FarhanCastle, OU=Dev, O=MyOrg, L=Tehran, S=Tehran, C=IR"

      - name: Sign APK
        run: |
          set -e
          BUILD_TOOLS_PATH=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          "$BUILD_TOOLS_PATH" sign \
            --ks my-release-key.jks \
            --ks-pass 'pass:Kabab123!' \
            --key-pass 'pass:Kabab123!' \
            --ks-key-alias my-key-alias \
            --out android/app/build/outputs/apk/debug/app-release-signed.apk \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Farhan-Castle-Release
          path: android/app/build/outputs/apk/debug/app-release-signed.apk
          if-no-files-found: error
