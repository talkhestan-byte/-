
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#172554">
<title>قلعه فرهان و دوستانش</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;900&display=swap');

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family: Vazirmatn, Tahoma, sans-serif;
  touch-action: manipulation;
}

body {
  background: #60a5fa;
}

button {
  font-family: inherit;
  touch-action: manipulation;
}

#game-container {
  position: relative;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(
    180deg,
    #1e3a8a 0%,
    #3b82f6 23%,
    #93c5fd 48%,
    #fde68a 73%,
    #fca5a5 100%
  );
}

.sky {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(
    180deg,
    #1e3a8a,
    #3b82f6 22%,
    #93c5fd 48%,
    #fde68a 75%,
    #f87171
  );
}

.sun {
  position: absolute;
  width: 100px;
  height: 100px;
  top: 85px;
  right: 25px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff9c4, #facc15 60%, transparent 75%);
  box-shadow: 0 0 60px #fde047;
  z-index: 1;
  animation: sunPulse 4s infinite alternate;
}

@keyframes sunPulse {
  to { transform: scale(1.08); }
}

.cloud {
  position: absolute;
  z-index: 2;
  width: 100px;
  height: 30px;
  background: #fff;
  border-radius: 40px;
  opacity: .9;
  animation: clouds 55s linear infinite;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: white;
}

.cloud::before {
  width: 45px;
  height: 45px;
  left: 15px;
  top: -20px;
}

.cloud::after {
  width: 35px;
  height: 35px;
  right: 15px;
  top: -13px;
}

.cloud.c1 { top: 14%; left: -120px; }
.cloud.c2 { top: 25%; left: -120px; animation-delay: -20s; }
.cloud.c3 { top: 8%; left: -120px; animation-delay: -35s; }

@keyframes clouds {
  from { transform: translateX(-120px); }
  to { transform: translateX(calc(100vw + 250px)); }
}

.mountains-far {
  position: absolute;
  bottom: 38%;
  width: 100%;
  height: 23%;
  z-index: 3;
  background: linear-gradient(#a78bfa, #6d28d9);
  clip-path: polygon(
    0 100%, 0 60%, 12% 35%, 22% 60%, 38% 20%,
    50% 55%, 65% 25%, 80% 60%, 92% 35%, 100% 55%, 100% 100%
  );
}

.mountains-near {
  position: absolute;
  bottom: 29%;
  width: 100%;
  height: 20%;
  z-index: 4;
  background: linear-gradient(#10b981, #047857);
  clip-path: polygon(
    0 100%, 0 55%, 15% 35%, 30% 65%, 45% 30%,
    60% 60%, 75% 35%, 90% 55%, 100% 40%, 100% 100%
  );
}

.forest {
  position: absolute;
  bottom: 21%;
  left: 0;
  width: 100%;
  height: 15%;
  z-index: 5;
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
}

.tree {
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-bottom: 48px solid #047857;
  position: relative;
}

.tree::after {
  content: "";
  position: absolute;
  left: -10px;
  top: 30px;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-bottom: 32px solid #059669;
}

.river {
  position: absolute;
  bottom: 10%;
  width: 100%;
  height: 13%;
  z-index: 6;
  background: repeating-linear-gradient(
    175deg,
    #0891b2 0,
    #06b6d4 12px,
    #0e7490 24px
  );
  animation: river 4s linear infinite;
}

@keyframes river {
  50% { filter: brightness(1.12); }
}

.grass-ground {
  position: absolute;
  bottom: 0;
  height: 15%;
  width: 100%;
  z-index: 7;
  background: linear-gradient(#4ade80, #15803d);
}

#flowers {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 14%;
  z-index: 8;
  pointer-events: none;
}

.flower {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

#castle-container {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  width: 190px;
  height: 165px;
  z-index: 20;
  filter: drop-shadow(0 7px 10px #0005);
}

.tower-left,
.tower-right {
  position: absolute;
  bottom: 0;
  width: 52px;
  height: 115px;
  background: linear-gradient(#c4b5fd, #7c3aed);
  border-radius: 6px 6px 0 0;
}

.tower-left { left: 0; }
.tower-right { right: 0; }

.tower-left::before,
.tower-right::before {
  content: "";
  position: absolute;
  top: -9px;
  width: 100%;
  height: 12px;
  background: repeating-linear-gradient(
    90deg, #8b5cf6 0 10px, transparent 10px 17px
  );
}

.tower-left::after,
.tower-right::after {
  content: "";
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  width: 16px;
  height: 22px;
  background: #fbbf24;
  border-radius: 9px 9px 0 0;
}

.castle-body {
  position: absolute;
  bottom: 0;
  left: 38px;
  right: 38px;
  height: 88px;
  background: linear-gradient(#c4b5fd, #8b5cf6);
}

.castle-body::before {
  content: "";
  position: absolute;
  top: -10px;
  left: 0;
  width: 100%;
  height: 12px;
  background: repeating-linear-gradient(
    90deg, #a78bfa 0 12px, transparent 12px 20px
  );
}

.door {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 53px;
  background: linear-gradient(#78350f, #451a03);
  border: 3px solid #a16207;
  border-radius: 20px 20px 0 0;
  z-index: 3;
}

.flag-pole {
  position: absolute;
  top: -53px;
  left: 50%;
  width: 3px;
  height: 58px;
  background: #e5e7eb;
  z-index: 5;
}

.flag-iran {
  position: absolute;
  top: -52px;
  left: calc(50% + 3px);
  width: 45px;
  height: 28px;
  display: flex;
  flex-direction: column;
  z-index: 5;
}

.flag-green { flex: 1; background: #239f40; }
.flag-white { flex: 1; background: #fff; }
.flag-red { flex: 1; background: #da0000; }

#header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  min-height: 58px;
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #ffffffed;
  border-bottom: 3px solid #f59e0b;
  color: #1e293b;
  font-size: 18px;
  font-weight: 900;
  z-index: 100;
}

#score-display { color: #b45309; }
.heart { font-size: 22px; margin-left: 3px; }

#time-bar-container {
  position: absolute;
  top: 58px;
  left: 0;
  width: 100%;
  height: 9px;
  background: #0003;
  z-index: 100;
}

#time-bar {
  height: 100%;
  width: 100%;
  background: #22c55e;
  transition: width .1s linear;
}

.bubble {
  position: absolute;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 7px;
  border: 3px solid #ffffffcc;
  border-radius: 50%;
  color: white;
  font-weight: 900;
  line-height: 1.2;
  text-shadow: 0 2px 4px #0009;
  box-shadow: inset -7px -7px 15px #0003, inset 6px 6px 15px #fff5, 0 5px 12px #0004;
  cursor: pointer;
  touch-action: manipulation;
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 200;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
  color: white;
  text-align: center;
  background: #0f172af2;
}

.screen.active { display: flex; }

.screen h1 {
  font-size: clamp(25px, 6vw, 34px);
  font-weight: 900;
  color: #fbbf24;
  margin: 8px 0 16px;
}

.screen p {
  font-size: 19px;
  line-height: 1.8;
  font-weight: 700;
  max-width: 500px;
}

.screen button {
  border: 0;
  border-radius: 16px;
  padding: 14px 34px;
  background: linear-gradient(135deg, #10b981, #047857);
  color: white;
  font-size: 22px;
  font-weight: 900;
  box-shadow: 0 6px 0 #065f46;
  cursor: pointer;
}

.screen button:active {
  transform: translateY(3px);
}

#screen-start {
  justify-content: center;
  background: #0f172aeF;
  padding: 18px 16px;
}

#start-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(12px, 2.5vh, 22px);
  width: 100%;
  max-width: 560px;
  margin: auto;
}

#start-image {
  display: block;
  width: min(68vw, 290px);
  height: min(32vh, 290px);
  min-height: 135px;
  object-fit: contain;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  animation: none;
}

#start-image.image-error {
  display: none;
}

#start-title {
  font-size: clamp(25px, 6vw, 34px);
  line-height: 1.5;
  margin: 0;
}

#start-rules {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.rule-line {
  width: 100%;
  padding: 12px 10px;
  border-radius: 14px;
  font-size: clamp(16px, 4.4vw, 21px);
  line-height: 1.7;
  font-weight: 900;
}

.rule-good {
  background: linear-gradient(135deg, #10b981, #047857);
  border: 2px solid #86efac;
}

.rule-bad {
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  border: 2px solid #fecaca;
}

#start-btn {
  background: linear-gradient(135deg, #fbbf24, #f97316);
  box-shadow: 0 6px 0 #b45309, 0 10px 25px #f59e0b55;
  border: 2px solid #ffffffaa;
  min-width: 190px;
  margin-top: 2px;
}

#champion-box {
  display: none;
  flex-direction: column;
  align-items: center;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  color: #7c2d12;
  border: 5px solid white;
  border-radius: 25px;
  padding: 20px 30px;
  margin-bottom: 15px;
}

#champion-box.show { display: flex; }

.trophy { font-size: 55px; }
.champion-title { font-size: 27px; font-weight: 900; }
.score-big { font-size: 50px; font-weight: 900; }

.delay-message {
  position: absolute;
  inset: 0;
  z-index: 180;
  display: none;
  align-items: center;
  justify-content: center;
  background: #0008;
  color: white;
  text-align: center;
  padding: 20px;
}

.delay-message.active { display: flex; }

.delay-message h1 {
  font-size: clamp(28px, 7vw, 44px);
  text-shadow: 0 4px 12px #000;
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  z-index: 190;
  pointer-events: none;
}

@media (max-height: 620px) {
  #start-content { gap: 8px; }
  #start-image {
    height: 24vh;
    min-height: 95px;
    width: min(45vw, 190px);
  }
  .rule-line { padding: 7px; }
  #start-btn { padding: 10px 28px; }
}
</style>
</head>

<body>
<div id="game-container">

  <div class="sky"></div>
  <div class="sun"></div>

  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <div class="mountains-far"></div>
  <div class="mountains-near"></div>

  <div class="forest">
    <div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div>
  </div>

  <div class="river"></div>
  <div class="grass-ground"></div>
  <div id="flowers"></div>

  <div id="header">
    <div id="score-display">امتیاز: ۰</div>
    <div id="lives-display">❤️❤️❤️</div>
  </div>

  <div id="time-bar-container">
    <div id="time-bar"></div>
  </div>

  <div id="castle-container">
    <div class="flag-pole"></div>
    <div class="flag-iran">
      <div class="flag-green"></div>
      <div class="flag-white"></div>
      <div class="flag-red"></div>
    </div>
    <div class="tower-left"></div>
    <div class="tower-right"></div>
    <div class="castle-body"></div>
    <div class="door"></div>
  </div>

  <div class="delay-message" id="delay-win">
    <h1>🏆 آفرین قهرمان! 🏆</h1>
  </div>

  <div class="delay-message" id="delay-lose">
    <h1>💔 قلعه سقوط کرد! 💔</h1>
  </div>

  <!-- صفحه شروع: فقط تصویر icon-only نمایش داده می‌شود -->
  <div class="screen active" id="screen-start">
    <div id="start-content">

      <img
        id="start-image"
        src="icon-only.png"
        alt="قلعه فرهان و دوستانش"
        onerror="this.classList.add('image-error')"
      >

      <h1 id="start-title">🏰 قلعه فرهان و دوستانش 🏰</h1>

      <div id="start-rules">
        <div class="rule-line rule-good">
          ✅ روی کلمات خوب ضربه بزن تا برنده بشی
        </div>
        <div class="rule-line rule-bad">
          ❌ روی کلمات بد ضربه نزن که می‌بازی
        </div>
      </div>

      <button id="start-btn" type="button">
        شروع بازی
      </button>
    </div>
  </div>

  <!-- صفحه برد -->
  <div class="screen" id="screen-win">
    <div id="champion-box">
      <div class="trophy">🏆</div>
      <div class="champion-title">قهرمان!</div>
      <p>امتیاز تو:</p>
      <div class="score-big" id="final-score">۰</div>
    </div>

    <h1>یک سؤال برای تو:</h1>
    <p id="win-question" style="color:#fbbf24"></p>
    <p style="color:#cbd5e1;font-size:16px">
      🎤 جوابت رو شفاهی به معلمت بگو
    </p>
    <button id="finish-btn" type="button">پایان</button>
  </div>

  <!-- صفحه باخت -->
  <div class="screen" id="screen-lose">
    <h1>💔 قلعه سقوط کرد! 💔</h1>
    <p>اشکالی نداره قهرمان! دوباره تلاش کن.</p>
    <button id="restart-btn" type="button">بازی مجدد</button>
  </div>

</div>

<!-- فایل موسیقی شروع -->
<audio id="start-music" src="start.mp3" preload="auto" loop></audio>
<audio id="win-audio" src="win.mp3" preload="auto"></audio>
<audio id="lose-audio" src="lose.mp3" preload="auto"></audio>

<script>
"use strict";

const $ = id => document.getElementById(id);

const gameContainer = $("game-container");
const scoreDisplay = $("score-display");
const livesDisplay = $("lives-display");
const timeBar = $("time-bar");

const startScreen = $("screen-start");
const winScreen = $("screen-win");
const loseScreen = $("screen-lose");

const startMusic = $("start-music");
const winAudio = $("win-audio");
const loseAudio = $("lose-audio");

let score = 0;
let lives = 3;
let timeLeft = 40;
let gameActive = false;
let bubbles = [];
let animationId = null;
let lastTime = 0;
let spawnTimer = 0;
let castleLineY = 0;
let confettiTimer = null;
let endTimer = null;
let firstPhase = true;
let audioContext = null;

const goodWords = [
  "مهربانی", "دوستی", "آفرین", "کمک کردن", "لبخند",
  "احترام", "همدلی", "فداکاری", "بخشش", "صداقت",
  "قول دادن", "گوش دادن", "تشکر کردن", "سلام کردن",
  "بازی کردن", "نقاشی", "کتاب خواندن", "صبر کردن",
  "قانون", "تمیزکاری", "شادی", "دلسوزی", "آرامش",
  "محبت", "همکاری", "ورزش کردن", "آب خوردن",
  "کمک به دوست", "بازی منصفانه", "گفتن حقیقت",
  "عذرخواهی", "غذای سالم", "کمک به مامان", "کمک به بابا"
];

const badWords = [
  "فحش", "کتک زدن", "مسخره کردن", "دعوا", "هل دادن",
  "داد زدن", "بی‌احترامی", "زورگویی", "دروغ", "اذیت کردن",
  "آزار دادن", "شکستن", "غیبت کردن", "بدگویی", "دزدی",
  "ترساندن", "تقلب", "بی‌ادبی", "جیغ زدن", "لگد زدن",
  "گاز گرفتن", "تف کردن", "بی‌نظمی", "دروغ گفتن",
  "قانون‌شکنی", "توهین", "پرت کردن", "کشیدن مو"
];

const winQuestions = [
  "وقتی دوستت ناراحت است، چه کار خوبی می‌توانی بکنی؟",
  "یک کلمه‌ی خوب که امروز یاد گرفتی چیست؟",
  "چرا دعوا کردن باعث ناراحتی دوستانت می‌شود؟",
  "چطور با کلمات خوب می‌توانیم دوستانمان را شاد کنیم؟"
];

const colors = [
  "#EF4444", "#3B82F6", "#10B981", "#F59E0B",
  "#8B5CF6", "#EC4899", "#06B6D4", "#F97316"
];

function randomItem(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function createFlowers() {
  const flowers = $("flowers");
  const flowerColors = [
    "#f472b6", "#fbbf24", "#ef4444",
    "#a78bfa", "#fb923c", "#ffffff"
  ];

  for (let i = 0; i < 40; i++) {
    const f = document.createElement("div");
    f.className = "flower";
    f.style.left = Math.random() * 100 + "%";
    f.style.bottom = Math.random() * 85 + "%";
    f.style.background = randomItem(flowerColors);
    flowers.appendChild(f);
  }
}

function ensureAudioContext() {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (AudioContextClass && !audioContext) {
      audioContext = new AudioContextClass();
    }

    if (audioContext && audioContext.state === "suspended") {
      audioContext.resume().catch(() => {});
    }
  } catch (e) {
    console.warn("AudioContext unavailable", e);
  }
}

function unlockAudio() {
  ensureAudioContext();

  [startMusic, winAudio, loseAudio].forEach(audio => {
    try {
      audio.load();
    } catch (_) {}
  });
}

function playStartMusic() {
  startMusic.volume = 0.55;

  if (!startMusic.paused) return;

  try {
    const result = startMusic.play();

    if (result && result.catch) {
      result.catch(error => {
        console.warn(
          "پخش خودکار موسیقی توسط مرورگر مسدود شد.",
          error
        );
      });
    }
  } catch (e) {
    console.warn("خطا در پخش موسیقی شروع", e);
  }
}

function stopStartMusic() {
  startMusic.pause();

  try {
    startMusic.currentTime = 0;
  } catch (_) {}
}

function playFile(audio, fallbackType) {
  try {
    audio.currentTime = 0;
    audio.volume = 0.8;

    const result = audio.play();

    if (result && result.catch) {
      result.catch(() => playTone(fallbackType));
    }
  } catch (_) {
    playTone(fallbackType);
  }
}

function playTone(type) {
  ensureAudioContext();

  if (!audioContext) return;

  try {
    const now = audioContext.currentTime;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    if (type === "good") {
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(450, now);
      oscillator.frequency.exponentialRampToValueAtTime(850, now + 0.12);
    } else {
      oscillator.type = "sawtooth";
      oscillator.frequency.setValueAtTime(160, now);
      oscillator.frequency.exponentialRampToValueAtTime(60, now + 0.22);
    }

    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

    oscillator.start(now);
    oscillator.stop(now + 0.26);
  } catch (_) {}
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  try {
    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "fa-IR";
    utterance.rate = 0.95;
    utterance.pitch = 1.1;

    speechSynthesis.speak(utterance);
  } catch (_) {}
}

function updateLives() {
  livesDisplay.textContent =
    "❤️".repeat(Math.max(0, lives)) +
    "🖤".repeat(Math.max(0, 3 - lives));
}

function clearBubbles() {
  bubbles.forEach(b => b.element.remove());
  bubbles = [];
}

function showOnlyScreen(screen) {
  [startScreen, winScreen, loseScreen].forEach(s => {
    s.classList.remove("active");
  });

  screen.classList.add("active");
}

function startGame() {
  unlockAudio();
  stopStartMusic();

  if (endTimer) {
    clearTimeout(endTimer);
    endTimer = null;
  }

  if (confettiTimer) {
    clearInterval(confettiTimer);
    confettiTimer = null;
  }

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  document.querySelectorAll(".confetti").forEach(el => el.remove());

  winAudio.pause();
  loseAudio.pause();

  showOnlyScreen(startScreen);
  startScreen.classList.remove("active");

  score = 0;
  lives = 3;
  timeLeft = 40;
  gameActive = false;

  clearBubbles();

  scoreDisplay.textContent = "امتیاز: ۰";
  updateLives();

  $("champion-box").classList.remove("show");

  castleLineY = $("castle-container").getBoundingClientRect().top;

  resetRound();
}

function resetRound() {
  clearBubbles();

  timeLeft = 40;
  spawnTimer = 0;
  firstPhase = true;
  gameActive = true;

  timeBar.style.width = "100%";
  timeBar.style.background = "#22c55e";

  castleLineY = $("castle-container").getBoundingClientRect().top;

  lastTime = performance.now();

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
  }

  animationId = requestAnimationFrame(gameLoop);
}

function spawnBubble() {
  const isGood = Math.random() > 0.45;
  const word = randomItem(isGood ? goodWords : badWords);

  const size = Math.min(
    125,
    Math.max(85, window.innerWidth * 0.25)
  );

  const maxX = Math.max(0, window.innerWidth - size);
  const x = Math.random() * maxX;

  const element = document.createElement("div");
  element.className = "bubble";

  const color = randomItem(
    firstPhase
      ? ["#FBBF24", "#4ADE80", "#3B82F6"]
      : colors
  );

  element.style.background =
    `radial-gradient(circle at 30% 25%, ${color}dd, ${color})`;

  element.style.width = size + "px";
  element.style.height = size + "px";
  element.style.left = x + "px";
  element.style.top = "-140px";
  element.style.fontSize =
    Math.max(13, Math.min(21, size / 5.2)) + "px";

  element.textContent = word;

  const bubble = {
    element,
    x,
    y: -140,
    size,
    speed: 70 + Math.random() * 35,
    isGood,
    dead: false
  };

  element.addEventListener("pointerdown", event => {
    event.preventDefault();

    if (!gameActive || bubble.dead) return;

    bubble.dead = true;
    element.remove();

    bubbles = bubbles.filter(b => b !== bubble);

    if (isGood) {
      score += 10;
      scoreDisplay.textContent = "امتیاز: " + score;
      playTone("good");
    } else {
      lives--;
      updateLives();
      playTone("bad");

      if (lives <= 0) {
        endGame(false);
      }
    }
  });

  gameContainer.appendChild(element);
  bubbles.push(bubble);
}

function gameLoop(timestamp) {
  if (!gameActive) {
    animationId = null;
    return;
  }

  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  timeLeft -= dt;

  const percent = Math.max(0, (timeLeft / 40) * 100);
  timeBar.style.width = percent + "%";

  if (timeLeft <= 20) firstPhase = false;

  if (timeLeft <= 10) {
    timeBar.style.background = "#ef4444";
  }

  if (timeLeft <= 0) {
    endGame(true);
    return;
  }

  spawnTimer += dt;

  if (spawnTimer >= 1.15) {
    spawnBubble();
    spawnTimer = 0;
  }

  castleLineY = $("castle-container").getBoundingClientRect().top;

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];

    if (b.dead) continue;

    b.y += b.speed * dt;
    b.element.style.top = b.y + "px";

    if (b.y + b.size >= castleLineY) {
      b.dead = true;
      b.element.remove();
      bubbles.splice(i, 1);
    }
  }

  animationId = requestAnimationFrame(gameLoop);
}

function createConfetti() {
  const element = document.createElement("div");
  element.className = "confetti";
  element.style.left = Math.random() * window.innerWidth + "px";
  element.style.top = "-15px";
  element.style.background = randomItem(colors);

  gameContainer.appendChild(element);

  const duration = 2000 + Math.random() * 2000;

  const animation = element.animate([
    { transform: "translateY(0) rotate(0deg)", opacity: 1 },
    {
      transform:
        `translate(${Math.random() * 160 - 80}px, ${window.innerHeight + 50}px) rotate(700deg)`,
      opacity: 0
    }
  ], {
    duration,
    easing: "ease-out"
  });

  animation.onfinish = () => element.remove();
}

function startConfetti() {
  if (confettiTimer) clearInterval(confettiTimer);

  confettiTimer = setInterval(() => {
    for (let i = 0; i < 8; i++) createConfetti();
  }, 150);
}

function endGame(won) {
  if (!gameActive) return;

  gameActive = false;

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  clearBubbles();

  if (won) {
    $("delay-win").classList.add("active");

    playFile(winAudio, "good");
    speak("آفرین قهرمان");

    startConfetti();

    endTimer = setTimeout(() => {
      $("delay-win").classList.remove("active");

      if (confettiTimer) {
        clearInterval(confettiTimer);
        confettiTimer = null;
      }

      document.querySelectorAll(".confetti").forEach(el => el.remove());

      $("final-score").textContent = score;
      $("champion-box").classList.add("show");
      $("win-question").textContent = randomItem(winQuestions);

      showOnlyScreen(winScreen);
    }, 3500);

  } else {
    $("delay-lose").classList.add("active");

    playFile(loseAudio, "bad");
    speak("دوباره تلاش کن قهرمان");

    endTimer = setTimeout(() => {
      $("delay-lose").classList.remove("active");
      showOnlyScreen(loseScreen);
    }, 2500);
  }
}

function finishGame() {
  stopStartMusic();

  if (window.Capacitor &&
      window.Capacitor.Plugins &&
      window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.exitApp();
  } else {
    startGame();
  }
}

/* دکمه‌ها */
$("start-btn").addEventListener("click", startGame);
$("restart-btn").addEventListener("click", startGame);
$("finish-btn").addEventListener("click", finishGame);

/*
 * تلاش برای پخش موسیقی هنگام بارگذاری برنامه.
 * اگر مرورگر یا WebView پخش خودکار را مسدود کند،
 * با اولین لمس کاربر دوباره تلاش می‌کنیم.
 */
window.addEventListener("load", () => {
  createFlowers();
  updateLives();
  playStartMusic();
});

/* سازگاری با محدودیت autoplay در Android و مرورگرها */
function firstInteraction() {
  unlockAudio();

  if (startScreen.classList.contains("active")) {
    playStartMusic();
  }

  document.removeEventListener("pointerdown", firstInteraction);
  document.removeEventListener("touchstart", firstInteraction);
  document.removeEventListener("keydown", firstInteraction);
}

document.addEventListener("pointerdown", firstInteraction);
document.addEventListener("touchstart", firstInteraction, { passive: true });
document.addEventListener("keydown", firstInteraction);

</script>
