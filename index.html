
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#66c8ff">
<title>قلعه فرهان و دوستانش</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --blue: #1688e8;
  --dark-blue: #14549b;
  --gold: #ffcb38;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Tahoma, Arial, sans-serif;
  background: #72d0ff;
  color: #173a55;
  user-select: none;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: 0;
  touch-action: manipulation;
}

#game {
  position: relative;
  width: 100%;
  height: 100dvh;
  min-height: 480px;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(
    to bottom,
    #65c8ff 0%,
    #b8eeff 55%,
    #d7f6c1 100%
  );
}

/* ---------- منظره ---------- */

.sun {
  position: absolute;
  top: 7%;
  left: 9%;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  background: #ffe66b;
  box-shadow: 0 0 35px #ffe66b;
  z-index: -1;
}

.cloud {
  position: absolute;
  width: 110px;
  height: 28px;
  background: rgba(255,255,255,.85);
  border-radius: 40px;
  z-index: -1;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  bottom: 7px;
  border-radius: 50%;
  background: inherit;
}

.cloud::before {
  width: 42px;
  height: 42px;
  right: 18px;
}

.cloud::after {
  width: 52px;
  height: 52px;
  right: 43px;
}

.cloud1 {
  top: 14%;
  right: 8%;
}

.cloud2 {
  top: 26%;
  left: 22%;
  transform: scale(.75);
}

.mountain {
  position: absolute;
  bottom: 24%;
  width: 0;
  height: 0;
  border-left: 100px solid transparent;
  border-right: 100px solid transparent;
  border-bottom: 170px solid #79b8a2;
  z-index: -1;
}

.mountain::after {
  content: "";
  position: absolute;
  top: 42px;
  left: -42px;
  width: 0;
  height: 0;
  border-left: 42px solid transparent;
  border-right: 42px solid transparent;
  border-bottom: 72px solid #e8f7f6;
}

.mountain1 {
  left: -50px;
}

.mountain2 {
  right: -30px;
  bottom: 26%;
  transform: scale(1.25);
  border-bottom-color: #6caa96;
}

.hill {
  position: absolute;
  bottom: -9%;
  width: 75%;
  height: 36%;
  border-radius: 50% 50% 0 0;
  background: #70cf72;
  z-index: -1;
}

.hill1 {
  left: -20%;
}

.hill2 {
  right: -20%;
  bottom: -13%;
  height: 43%;
  background: #49b95d;
}

.river {
  position: absolute;
  z-index: -1;
  bottom: 0;
  left: 25%;
  width: 36%;
  height: 32%;
  background: #55c8f2;
  border-radius: 60% 50% 0 0;
  transform: rotate(-8deg);
  opacity: .9;
}

.tree {
  position: absolute;
  bottom: 16%;
  z-index: -1;
  font-size: clamp(35px, 8vw, 65px);
  filter: drop-shadow(0 3px 2px #267c3c);
}

.tree1 {
  left: 3%;
}

.tree2 {
  right: 4%;
  bottom: 20%;
}

.castle {
  position: absolute;
  left: 50%;
  bottom: 12%;
  transform: translateX(-50%);
  width: clamp(145px, 35vw, 260px);
  height: clamp(130px, 30vh, 205px);
  z-index: 0;
  filter: drop-shadow(0 5px 4px rgba(0,0,0,.2));
}

.castle-main {
  position: absolute;
  bottom: 0;
  left: 20%;
  width: 60%;
  height: 70%;
  border: 4px solid #a45e35;
  border-radius: 5px 5px 0 0;
  background: linear-gradient(90deg, #f4bb69, #ffe1a0, #e9a958);
}

.castle-tower {
  position: absolute;
  bottom: 0;
  width: 27%;
  height: 90%;
  border: 4px solid #a45e35;
  background: linear-gradient(90deg, #e9a45c, #ffdda0);
}

.castle-tower.left {
  left: 0;
}

.castle-tower.right {
  right: 0;
}

.castle-roof {
  position: absolute;
  top: -22%;
  left: -12%;
  width: 124%;
  height: 25%;
  background: #d95345;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.castle-door {
  position: absolute;
  bottom: 0;
  left: 36%;
  width: 28%;
  height: 42%;
  background: #85452b;
  border-radius: 50% 50% 0 0;
}

.castle-window {
  position: absolute;
  top: 24%;
  left: 43%;
  width: 14%;
  height: 19%;
  background: #72d7ef;
  border: 2px solid #a45e35;
  border-radius: 50% 50% 0 0;
}

.flag {
  position: absolute;
  top: -30%;
  left: 45%;
  width: 4px;
  height: 34%;
  background: #70452b;
}

.flag::after {
  content: "";
  position: absolute;
  top: 0;
  left: 3px;
  width: 30px;
  height: 17px;
  background: #e94343;
  clip-path: polygon(0 0,100% 0,75% 100%,0 100%);
}

/* ---------- صفحه شروع و پایان ---------- */

.screen {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px;
  overflow-y: auto;
  background: linear-gradient(
    180deg,
    rgba(91,196,255,.92),
    rgba(204,245,255,.94)
  );
  text-align: center;
}

#startScreen {
  display: flex;
}

#endScreen {
  display: none;
  background: rgba(220,246,255,.96);
}

.game-title {
  color: #104f8e;
  font-size: clamp(24px, 5.5vw, 40px);
  font-weight: 900;
  line-height: 1.5;
  text-shadow: 0 2px white, 2px 3px rgba(255,255,255,.6);
  margin: 0;
}

.start-icon {
  display: block;
  width: min(65vw, 300px);
  height: min(30vh, 230px);
  object-fit: contain;
  flex-shrink: 0;
  filter: drop-shadow(0 5px 7px rgba(0,0,0,.18));
}

.instructions {
  width: min(100%, 440px);
  padding: 10px 14px;
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 14px;
  background: rgba(255,255,255,.82);
  color: #214f6d;
  font-weight: bold;
  font-size: clamp(13px, 3.5vw, 17px);
  line-height: 1.8;
}

.primary-button {
  min-width: 190px;
  padding: 13px 28px;
  border-radius: 18px;
  color: #533800;
  font-weight: 900;
  font-size: 21px;
  background: linear-gradient(#ffe878, #ffb928);
  box-shadow: 0 5px 0 #d98b13, 0 8px 15px rgba(0,0,0,.15);
  transition: transform .12s;
}

.primary-button:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #d98b13;
}

.secondary-button {
  padding: 10px 22px;
  border-radius: 13px;
  color: white;
  background: #2589da;
  font-size: 17px;
  font-weight: bold;
}

#resultTitle {
  font-size: clamp(28px, 7vw, 42px);
  margin: 0;
}

#resultMessage {
  font-size: 20px;
  line-height: 1.8;
}

/* ---------- رابط بازی ---------- */

#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 5;
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  flex-wrap: wrap;
}

.hud-item {
  padding: 8px 12px;
  background: rgba(255,255,255,.93);
  border: 2px solid rgba(255,255,255,.8);
  border-radius: 13px;
  box-shadow: 0 3px 8px rgba(0,0,0,.1);
  font-size: clamp(13px, 3.4vw, 17px);
  font-weight: bold;
  color: #174e78;
}

#playArea {
  position: absolute;
  inset: 65px 0 0;
  display: none;
  z-index: 4;
  overflow: hidden;
}

.word-bubble {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 78px;
  min-height: 55px;
  max-width: 150px;
  padding: 10px 13px;
  border: 3px solid rgba(255,255,255,.95);
  border-radius: 50%;
  background: linear-gradient(145deg, #fff, #c8f5ff);
  color: #174d86;
  font-size: clamp(15px, 4vw, 20px);
  font-weight: 900;
  text-align: center;
  box-shadow: 0 5px 12px rgba(0,0,0,.15);
  animation: bubbleFloat 2s ease-in-out infinite alternate;
}

.word-bubble.good {
  background: linear-gradient(145deg, #ffffff, #c6ffbc);
}

.word-bubble.bad {
  background: linear-gradient(145deg, #fff, #ffc7c7);
}

@keyframes bubbleFloat {
  from { transform: translateY(0) rotate(-3deg); }
  to { transform: translateY(-8px) rotate(3deg); }
}

#gameMessage {
  position: absolute;
  z-index: 6;
  top: 22%;
  left: 50%;
  transform: translateX(-50%);
  max-width: 90%;
  padding: 10px 17px;
  border-radius: 15px;
  background: rgba(255,255,255,.92);
  color: #18517a;
  font-weight: bold;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
}

#gameMessage.show {
  opacity: 1;
}

#soundButton {
  position: absolute;
  bottom: 12px;
  left: 12px;
  z-index: 8;
  display: none;
  padding: 10px 13px;
  border-radius: 50px;
  background: rgba(255,255,255,.94);
  color: #174e78;
  font-size: 15px;
  font-weight: bold;
}

/* گوشی‌های کوچک */
@media (max-height: 650px) {
  .screen {
    gap: 7px;
    padding: 10px;
  }

  .start-icon {
    height: min(25vh, 155px);
  }

  .instructions {
    padding: 6px 10px;
  }

  .primary-button {
    padding: 10px 25px;
  }

  .castle {
    bottom: 8%;
  }
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>
<div id="game">

  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="mountain mountain1"></div>
  <div class="mountain mountain2"></div>
  <div class="hill hill1"></div>
  <div class="hill hill2"></div>
  <div class="river"></div>
  <div class="tree tree1">🌳</div>
  <div class="tree tree2">🌲</div>

  <div class="castle" id="castle">
    <div class="castle-main">
      <div class="castle-door"></div>
      <div class="castle-window"></div>
    </div>
    <div class="castle-tower left">
      <div class="castle-roof"></div>
    </div>
    <div class="castle-tower right">
      <div class="castle-roof"></div>
    </div>
    <div class="flag"></div>
  </div>

  <!-- صفحه شروع -->
  <section class="screen" id="startScreen">
    <h1 class="game-title">🏰 قلعه فرهان و دوستانش</h1>

    <img
      id="startIcon"
      class="start-icon"
      src="./icon-only.png"
      alt="تصویر بازی قلعه فرهان و دوستانش"
    >

    <div class="instructions">
      🎯 روی کلمه‌های خوب بزن و ۱۰ امتیاز بگیر!
    </div>

    <div class="instructions">
      ⚠️ از کلمه‌های بد دوری کن؛ با ۳ اشتباه بازی تمام می‌شود.
      <br>
      ⏱️ برای پیروزی باید ۴۰ ثانیه دوام بیاوری.
    </div>

    <button class="primary-button" id="startButton" type="button">
      شروع بازی 🚀
    </button>

    <div id="assetNotice" style="font-size:12px;color:#6c5360" hidden>
      تصویر آیکن پیدا نشد؛ نام فایل و مسیر آن را بررسی کن.
    </div>
  </section>

  <!-- اطلاعات بازی -->
  <div id="hud">
    <div class="hud-item">⭐ امتیاز: <span id="score">۰</span></div>
    <div class="hud-item">❤️ جان: <span id="lives">۳</span></div>
    <div class="hud-item">⏱️ زمان: <span id="timer">۴۰</span></div>
  </div>

  <div id="playArea" aria-label="محیط بازی"></div>
  <div id="gameMessage" role="status"></div>

  <button id="soundButton" type="button">🔊 صدا روشن</button>

  <!-- صفحه پایان -->
  <section class="screen" id="endScreen">
    <h2 id="resultTitle">آفرین!</h2>
    <div id="resultMessage"></div>
    <button class="primary-button" id="restartButton" type="button">
      بازی دوباره 🔄
    </button>
    <button class="secondary-button" id="homeButton" type="button">
      صفحه شروع 🏠
    </button>
  </section>

  <!-- فایل‌های صوتی -->
  <audio id="startMusic" src="./start.mp3" preload="auto" loop></audio>
  <audio id="winSound" src="./win.mp3" preload="auto"></audio>
  <audio id="loseSound" src="./lose.mp3" preload="auto"></audio>
</div>

<script>
"use strict";

/* ---------- دسترسی به اجزای صفحه ---------- */
const $ = (id) => document.getElementById(id);

const startScreen = $("startScreen");
const endScreen = $("endScreen");
const startButton = $("startButton");
const restartButton = $("restartButton");
const homeButton = $("homeButton");
const startMusic = $("startMusic");
const winSound = $("winSound");
const loseSound = $("loseSound");
const playArea = $("playArea");
const hud = $("hud");
const soundButton = $("soundButton");
const gameMessage = $("gameMessage");
const startIcon = $("startIcon");

let score = 0;
let lives = 3;
let timeLeft = 40;
let gameRunning = false;
let soundEnabled = true;
let timerInterval = null;
let spawnInterval = null;
let messageTimeout = null;
let roundId = 0;

const GOOD_WORDS = [
  "دوستی", "مهربانی", "فرهان", "کمک",
  "راستی", "شجاعت", "تلاش", "دانایی",
  "همکاری", "امید", "خوبی", "احترام"
];

const BAD_WORDS = [
  "دروغ", "دعوا", "تنبلی", "بی‌احترامی",
  "تقلب", "بدرفتاری"
];

/* ---------- تصویر آیکن ---------- */
startIcon.addEventListener("error", function () {
  $("assetNotice").hidden = false;
  this.style.display = "none";
});

/* ---------- صدا ---------- */
function playAudio(audio, restart = true) {
  if (!soundEnabled || !audio) return;

  try {
    if (restart) audio.currentTime = 0;
    const promise = audio.play();
    if (promise && typeof promise.catch === "function") {
      promise.catch(() => {
        // محدودیت پخش خودکار مرورگر؛ بازی بدون صدا هم کار می‌کند.
      });
    }
  } catch (error) {
    // خطای صوتی نباید اجرای بازی را متوقف کند.
  }
}

function stopAudio(audio) {
  if (!audio) return;
  audio.pause();
  try {
    audio.currentTime = 0;
  } catch (error) {}
}

function playBackgroundMusic() {
  if (!soundEnabled) return;

  try {
    const promise = startMusic.play();
    if (promise && typeof promise.catch === "function") {
      promise.catch(() => {});
    }
  } catch (error) {}
}

function enableAudioFromGesture() {
  if (!soundEnabled) return;

  // برای مرورگرهایی که پخش خودکار را مسدود می‌کنند.
  playBackgroundMusic();
}

document.addEventListener("pointerdown", enableAudioFromGesture, {
  passive: true
});

/* ---------- نمایش پیام ---------- */
function showMessage(text) {
  gameMessage.textContent = text;
  gameMessage.classList.add("show");

  clearTimeout(messageTimeout);
  messageTimeout = setTimeout(() => {
    gameMessage.classList.remove("show");
  }, 850);
}

/* ---------- اعداد فارسی ---------- */
function persianNumber(number) {
  return String(number).replace(/[0-9]/g, digit =>
    "۰۱۲۳۴۵۶۷۸۹"[Number(digit)]
  );
}

/* ---------- به‌روزرسانی اطلاعات ---------- */
function updateHud() {
  $("score").textContent = persianNumber(score);
  $("lives").textContent = persianNumber(lives);
  $("timer").textContent = persianNumber(timeLeft);
}

/* ---------- ساخت کلمه‌ها ---------- */
function createBubble() {
  if (!gameRunning) return;

  const isGood = Math.random() < 0.72;
  const words = isGood ? GOOD_WORDS : BAD_WORDS;
  const word = words[Math.floor(Math.random() * words.length)];

  const bubble = document.createElement("button");
  bubble.type = "button";
  bubble.className = "word-bubble " + (isGood ? "good" : "bad");
  bubble.textContent = word;
  bubble.setAttribute("aria-label", "کلمه " + word);

  const areaWidth = playArea.clientWidth;
  const areaHeight = playArea.clientHeight;

  const maxLeft = Math.max(0, areaWidth - 145);
  const maxTop = Math.max(0, areaHeight - 90);

  bubble.style.left = Math.floor(Math.random() * maxLeft) + "px";
  bubble.style.top = Math.floor(Math.random() * maxTop) + "px";

  const currentRound = roundId;

  bubble.addEventListener("click", function () {
    if (!gameRunning || currentRound !== roundId) return;
    if (!bubble.isConnected) return;

    bubble.remove();

    if (isGood) {
      score += 10;
      showMessage("آفرین! ⭐ ۱۰ امتیاز گرفتی");
      speakWord("آفرین");
    } else {
      lives -= 1;
      showMessage("اوه! یک جان از دست دادی ❤️");
      speakWord("مراقب باش");
    }

    updateHud();

    if (lives <= 0) {
      finishGame(false);
    }
  });

  playArea.appendChild(bubble);

  // کلمه‌ها پس از چند ثانیه ناپدید می‌شوند.
  setTimeout(() => {
    if (bubble.isConnected) bubble.remove();
  }, 4200);
}

/* ---------- صدای گفتاری اختیاری ---------- */
function speakWord(text) {
  if (!soundEnabled || !("speechSynthesis" in window)) return;

  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "fa-IR";
    utterance.rate = 1;
    utterance.volume = 0.65;
    window.speechSynthesis.speak(utterance);
  } catch (error) {}
}

/* ---------- شروع بازی ---------- */
function startGame() {
  clearInterval(timerInterval);
  clearInterval(spawnInterval);
  clearTimeout(messageTimeout);

  roundId += 1;
  score = 0;
  lives = 3;
  timeLeft = 40;
  gameRunning = true;

  playArea.replaceChildren();
  gameMessage.classList.remove("show");

  startScreen.style.display = "none";
  endScreen.style.display = "none";
  hud.style.display = "flex";
  playArea.style.display = "block";
  soundButton.style.display = "block";

  updateHud();

  // موسیقی start.mp3 در طول بازی نیز پخش می‌شود.
  playBackgroundMusic();

  // اولین کلمه‌ها بدون تأخیر زیاد ظاهر می‌شوند.
  createBubble();
  createBubble();

  spawnInterval = setInterval(() => {
    if (gameRunning) createBubble();
  }, 900);

  timerInterval = setInterval(() => {
    if (!gameRunning) return;

    timeLeft -= 1;
    updateHud();

    if (timeLeft <= 0) {
      timeLeft = 0;
      updateHud();
      finishGame(true);
    }
  }, 1000);
}

/* ---------- پایان بازی ---------- */
function finishGame(won) {
  if (!gameRunning) return;

  gameRunning = false;
  clearInterval(timerInterval);
  clearInterval(spawnInterval);
  clearTimeout(messageTimeout);

  roundId += 1;
  playArea.replaceChildren();
  playArea.style.display = "none";
  hud.style.display = "none";
  soundButton.style.display = "none";
  gameMessage.classList.remove("show");

  if ("speechSynthesis" in window) {
    try {
      window.speechSynthesis.cancel();
    } catch (error) {}
  }

  if (won) {
    $("resultTitle").textContent = "🏆 تو برنده شدی!";
    $("resultTitle").style.color = "#15803d";
    $("resultMessage").textContent =
      "۴۰ ثانیه دوام آوردی! امتیاز نهایی: " +
      persianNumber(score);
    stopAudio(startMusic);
    playAudio(winSound);
  } else {
    $("resultTitle").textContent = "💔 بازی تمام شد!";
    $("resultTitle").style.color = "#c62828";
    $("resultMessage").textContent =
      "جان‌هایت تمام شد. امتیاز تو: " +
      persianNumber(score) +
      "؛ دوباره تلاش کن!";
    stopAudio(startMusic);
    playAudio(loseSound);
  }

  endScreen.style.display = "flex";
}

/* ---------- بازگشت به صفحه شروع ---------- */
function goHome() {
  gameRunning = false;
  clearInterval(timerInterval);
  clearInterval(spawnInterval);
  clearTimeout(messageTimeout);

  roundId += 1;
  playArea.replaceChildren();
  playArea.style.display = "none";
  hud.style.display = "none";
  soundButton.style.display = "none";
  endScreen.style.display = "none";
  startScreen.style.display = "flex";

  stopAudio(winSound);
  stopAudio(loseSound);
  playBackgroundMusic();
}

/* ---------- رویداد دکمه‌ها ---------- */
startButton.addEventListener("click", function () {
  startGame();
});

restartButton.addEventListener("click", function () {
  stopAudio(winSound);
  stopAudio(loseSound);
  startGame();
});

homeButton.addEventListener("click", function () {
  stopAudio(winSound);
  stopAudio(loseSound);
  goHome();
});

soundButton.addEventListener("click", function () {
  soundEnabled = !soundEnabled;

  if (soundEnabled) {
    soundButton.textContent = "🔊 صدا روشن";
    playBackgroundMusic();
  } else {
    soundButton.textContent = "🔇 صدا خاموش";
    stopAudio(startMusic);
    stopAudio(winSound);
    stopAudio(loseSound);

    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
  }
});

/* ---------- راه‌اندازی اولیه ---------- */
window.addEventListener("load", function () {
  updateHud();

  // تلاش برای پخش موسیقی هنگام بازشدن برنامه.
  // اگر مرورگر اجازه ندهد، با اولین لمس کاربر دوباره تلاش می‌شود.
  playBackgroundMusic();
});
</script>
</body>
