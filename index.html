<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>قلعه فرهان و دوستانش</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@700;900&display=swap');
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; font-family: 'Vazirmatn', Tahoma, sans-serif; touch-action: none; background: #87CEEB; }
  #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* ================== آسمان ================== */
  .sky {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      #1e3a8a 0%, #3b82f6 20%, #60a5fa 40%, #93c5fd 55%,
      #bfdbfe 68%, #fde68a 80%, #fca5a5 90%, #f87171 100%);
    z-index: 0;
  }
  .sun {
    position: absolute; top: 70px; right: 40px;
    width: 130px; height: 130px;
    background: radial-gradient(circle, #fff9c4 0%, #fde047 40%, #f59e0b 70%, transparent 100%);
    border-radius: 50%;
    box-shadow: 0 0 80px #fde047, 0 0 150px rgba(253,224,71,0.5);
    z-index: 1;
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 80px #fde047, 0 0 150px rgba(253,224,71,0.5); }
    50% { transform: scale(1.05); box-shadow: 0 0 100px #fde047, 0 0 200px rgba(253,224,71,0.7); }
  }
  .sun-rays {
    position: absolute; top: 30px; right: 0;
    width: 220px; height: 220px;
    background: radial-gradient(circle, transparent 45%, rgba(253,224,71,0.15) 55%, transparent 70%);
    animation: rotateRays 30s linear infinite;
    z-index: 0;
  }
  @keyframes rotateRays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ================== ابرها ================== */
  .cloud { position: absolute; z-index: 2; opacity: 0.95; will-change: transform; }
  .cloud-shape {
    position: relative; background: white; border-radius: 100px;
    box-shadow: inset -8px -8px 20px rgba(147,197,253,0.35), 0 10px 25px rgba(255,255,255,0.5);
  }
  .cloud-shape::before, .cloud-shape::after {
    content: ''; position: absolute; background: white; border-radius: 50%;
  }
  .cloud-shape::before { width: 55%; height: 130%; top: -55%; left: 15%; box-shadow: inset -5px -5px 15px rgba(147,197,253,0.25); }
  .cloud-shape::after { width: 45%; height: 110%; top: -45%; right: 10%; box-shadow: inset -5px -5px 15px rgba(147,197,253,0.25); }

  .cloud-1 { top: 12%; width: 130px; height: 45px; animation: driftCloud 55s linear infinite; }
  .cloud-2 { top: 24%; width: 90px; height: 32px; animation: driftCloud 70s linear infinite; animation-delay: -10s; opacity: 0.85; }
  .cloud-3 { top: 8%; width: 160px; height: 55px; animation: driftCloud 80s linear infinite; animation-delay: -30s; opacity: 0.9; }
  .cloud-4 { top: 32%; width: 75px; height: 28px; animation: driftCloud 65s linear infinite; animation-delay: -25s; opacity: 0.75; }
  .cloud-5 { top: 18%; width: 110px; height: 40px; animation: driftCloud 90s linear infinite; animation-delay: -50s; opacity: 0.85; }
  .cloud-6 { top: 40%; width: 60px; height: 22px; animation: driftCloud 60s linear infinite; animation-delay: -15s; opacity: 0.7; }

  @keyframes driftCloud {
    from { transform: translateX(-250px); }
    to { transform: translateX(calc(100vw + 250px)); }
  }

  /* ================== کوه‌ها ================== */
  .mountains-far {
    position: absolute; bottom: 38%; left: 0; right: 0; height: 22%;
    z-index: 3;
    background: linear-gradient(180deg, #a78bfa 0%, #8b5cf6 60%, #7c3aed 100%);
    clip-path: polygon(
      0% 100%, 0% 60%, 8% 45%, 15% 55%, 22% 35%, 30% 50%,
      38% 25%, 46% 48%, 54% 30%, 62% 55%, 70% 40%, 78% 58%,
      86% 42%, 93% 55%, 100% 45%, 100% 100%);
    opacity: 0.75;
  }
  .mountains-far::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, #f8fafc 0%, #e0e7ff 8%, transparent 22%);
    clip-path: polygon(
      0% 100%, 0% 60%, 8% 45%, 15% 55%, 22% 35%, 30% 50%,
      38% 25%, 46% 48%, 54% 30%, 62% 55%, 70% 40%, 78% 58%,
      86% 42%, 93% 55%, 100% 45%, 100% 100%);
    opacity: 0.85;
  }
  .mountains-near {
    position: absolute; bottom: 30%; left: 0; right: 0; height: 18%;
    z-index: 4;
    background: linear-gradient(180deg, #10b981 0%, #059669 60%, #047857 100%);
    clip-path: polygon(
      0% 100%, 0% 70%, 10% 50%, 20% 65%, 30% 40%,
      42% 60%, 52% 35%, 63% 58%, 74% 42%, 85% 62%,
      93% 48%, 100% 65%, 100% 100%);
  }

  /* ================== جنگل ================== */
  .forest {
    position: absolute; bottom: 22%; left: 0; right: 0; height: 14%;
    z-index: 5; display: flex; justify-content: space-around; align-items: flex-end; padding: 0 2%;
  }
  .tree {
    position: relative; width: 0; height: 0;
    border-left: 18px solid transparent; border-right: 18px solid transparent;
    border-bottom: 45px solid #047857;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.2));
  }
  .tree::after {
    content: ''; position: absolute; bottom: -45px; left: -14px;
    width: 28px; height: 30px;
    border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-bottom: 35px solid #059669;
  }
  .tree::before {
    content: ''; position: absolute; bottom: -60px; left: -2px;
    width: 6px; height: 15px; background: #78350f;
  }
  .tree:nth-child(2n) { transform: scale(0.85); border-bottom-color: #065f46; }
  .tree:nth-child(3n) { transform: scale(1.1); }
  .tree:nth-child(4n) { transform: scale(0.75); border-bottom-color: #0891b2; }
  .tree:nth-child(5n) { transform: scale(0.95); border-bottom-color: #10b981; }

  /* ================== رودخانه ================== */
  .river {
    position: absolute; bottom: 12%; left: 0; right: 0; height: 12%;
    z-index: 6;
    background: linear-gradient(180deg, #06b6d4 0%, #0891b2 40%, #0e7490 100%);
    overflow: hidden;
  }
  .river::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 100%;
    background: repeating-linear-gradient(90deg,
      transparent 0px, rgba(255,255,255,0.25) 20px,
      transparent 40px, rgba(255,255,255,0.15) 60px, transparent 80px);
    animation: riverFlow 8s linear infinite;
  }
  @keyframes riverFlow {
    from { transform: translateX(0); } to { transform: translateX(80px); }
  }

  /* ================== چمن ================== */
  .grass-ground {
    position: absolute; bottom: 0; left: 0; right: 0; height: 14%;
    z-index: 7;
    background: linear-gradient(180deg, #4ade80 0%, #22c55e 30%, #16a34a 70%, #15803d 100%);
  }
  .flowers {
    position: absolute; bottom: 0; left: 0; right: 0; height: 14%;
    z-index: 8; pointer-events: none; overflow: hidden;
  }
  .flower {
    position: absolute; border-radius: 50%;
    animation: sway 3s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  /* ================== قلعه ================== */
  #castle-container {
    position: absolute; bottom: 5%; left: 50%;
    transform: translateX(-50%);
    width: 200px; height: 170px;
    z-index: 20;
    filter: drop-shadow(0 8px 15px rgba(0,0,0,0.3));
  }
  .tower-left, .tower-right {
    position: absolute; bottom: 0; width: 55px; height: 120px;
    background: linear-gradient(180deg, #a78bfa 0%, #8b5cf6 40%, #7c3aed 100%);
    border-radius: 8px 8px 0 0;
    box-shadow: inset -5px -5px 0 rgba(0,0,0,0.15), inset 5px 5px 0 rgba(255,255,255,0.1);
  }
  .tower-left { left: 0; } .tower-right { right: 0; }
  .tower-left::before, .tower-right::before {
    content: ''; position: absolute; top: -8px; left: 0; right: 0; height: 12px;
    background: repeating-linear-gradient(90deg, #8b5cf6 0px, #8b5cf6 10px, transparent 10px, transparent 18px);
    border-radius: 4px 4px 0 0;
  }
  .tower-left::after, .tower-right::after {
    content: ''; position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
    width: 16px; height: 22px; background: #fbbf24;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 0 8px #fbbf24, inset 0 0 4px rgba(0,0,0,0.4);
  }
  .castle-body {
    position: absolute; bottom: 0; left: 40px; right: 40px; height: 90px;
    background: linear-gradient(180deg, #c4b5fd 0%, #a78bfa 40%, #8b5cf6 100%);
    box-shadow: inset -8px -8px 0 rgba(0,0,0,0.15), inset 8px 8px 0 rgba(255,255,255,0.15);
  }
  .castle-body::before {
    content: ''; position: absolute; top: -10px; left: 0; right: 0; height: 12px;
    background: repeating-linear-gradient(90deg, #a78bfa 0px, #a78bfa 12px, transparent 12px, transparent 20px);
  }
  .door {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 42px; height: 55px;
    background: linear-gradient(180deg, #451a03 0%, #78350f 50%, #451a03 100%);
    border-radius: 21px 21px 0 0;
    border: 3px solid #a16207;
    box-shadow: inset 0 -10px 15px rgba(0,0,0,0.6);
    z-index: 3;
  }
  .door::after {
    content: ''; position: absolute; top: 50%; right: 6px;
    width: 5px; height: 5px; background: #fbbf24;
    border-radius: 50%; box-shadow: 0 0 4px #fbbf24;
  }

  /* ================== پرچم ایران ================== */
  .flag-pole {
    position: absolute; top: -55px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 60px;
    background: linear-gradient(90deg, #78716c, #d6d3d1, #78716c);
    border-radius: 2px; z-index: 5;
  }
  .flag-iran {
    position: absolute; top: -55px; left: calc(50% + 2px);
    width: 50px; height: 32px;
    display: flex; flex-direction: column;
    animation: waveFlag 2.5s ease-in-out infinite;
    transform-origin: right center;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
    border-radius: 0 3px 3px 0;
    overflow: hidden; z-index: 4;
  }
  .flag-green  { flex: 1; background: #239f40; }
  .flag-white  { flex: 1; background: #ffffff; display: flex; align-items: center; justify-content: center; }
  .flag-red    { flex: 1; background: #da0000; }
  .flag-white::after { content: '☫'; font-size: 12px; color: #da0000; line-height: 1; }
  @keyframes waveFlag {
    0%, 100% { transform: skewY(0deg) scaleX(1); }
    50% { transform: skewY(-3deg) scaleX(0.96); }
  }

  /* ================== هدر ================== */
  #header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 22px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.85) 100%);
    backdrop-filter: blur(12px);
    font-size: 20px; font-weight: 900; color: #1E293B;
    z-index: 100;
    border-bottom: 4px solid;
    border-image: linear-gradient(90deg, #f59e0b, #ef4444, #8b5cf6, #3b82f6, #10b981) 1;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  #score-display {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: 4px 12px; border-radius: 10px; background-color: rgba(251,191,36,0.1);
  }
  .heart {
    color: #ef4444; font-size: 26px; margin-left: 3px;
    filter: drop-shadow(0 2px 3px rgba(239,68,68,0.4));
    display: inline-block;
    animation: heartBeat 1.5s ease-in-out infinite;
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    20% { transform: scale(1.15); }
    40% { transform: scale(1); }
  }
  #time-bar-container {
    position: absolute; top: 66px; left: 0;
    width: 100%; height: 12px; background: rgba(0,0,0,0.15);
    z-index: 100; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
  }
  #time-bar {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #10b981, #22c55e, #4ade80);
    transition: width 0.1s linear, background 0.5s;
    box-shadow: 0 0 10px rgba(34,197,94,0.6);
  }

  /* ================== حباب‌ها ================== */
  .bubble {
    position: absolute; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 900; text-align: center;
    box-shadow:
      inset -8px -8px 20px rgba(0,0,0,0.25),
      inset 8px 8px 20px rgba(255,255,255,0.3),
      0 8px 20px rgba(0,0,0,0.25);
    cursor: pointer; z-index: 30; padding: 6px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.45);
    line-height: 1.15;
    will-change: top;
  }
  .bubble::before {
    content: ''; position: absolute; top: 12%; left: 15%;
    width: 22%; height: 22%;
    background: radial-gradient(circle, rgba(255,255,255,0.9), transparent);
    border-radius: 50%; pointer-events: none;
  }

  /* ================== کانفتی ================== */
  .confetti {
    position: absolute; width: 12px; height: 12px;
    z-index: 150; opacity: 0.9; top: -20px; pointer-events: none;
  }

  /* ================== صفحات ================== */
  .screen {
    position: absolute; inset: 0; z-index: 200;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(15, 23, 42, 0.95);
    color: white; text-align: center; padding: 20px;
    opacity: 0; transition: opacity 0.5s;
    overflow-y: auto;
  }
  .screen.active { display: flex; opacity: 1; }
  .screen h1 {
    font-size: 34px;
    background: linear-gradient(135deg, #fbbf24, #f59e0b, #ef4444, #fbbf24);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 15px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
  }
  .screen p {
    font-size: 20px; line-height: 1.8;
    max-width: 500px; margin-bottom: 25px; font-weight: 700;
  }
  .screen button {
    padding: 15px 40px; font-size: 24px;
    font-family: inherit; font-weight: 900;
    background: linear-gradient(135deg, #10b981, #059669);
    color: white; border: none; border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 8px 0 #047857, 0 12px 20px rgba(16,185,129,0.4);
    transition: all 0.1s;
  }
  .screen button:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #047857, 0 8px 15px rgba(16,185,129,0.4);
  }

  /* ================== صفحه شروع ================== */
  #screen-start {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    justify-content: flex-start;
    padding-top: 40px;
    padding-bottom: 40px;
  }
  #start-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 600px;
    gap: 25px;
  }
  #app-icon-wrapper {
    width: 220px;
    height: 220px;
    border-radius: 50px;
    background: linear-gradient(135deg, #fbbf24, #f59e0b, #ef4444, #8b5cf6, #3b82f6);
    padding: 6px;
    box-shadow:
      0 20px 60px rgba(251,191,36,0.5),
      0 0 0 4px rgba(255,255,255,0.3),
      inset 0 0 20px rgba(255,255,255,0.2);
    animation: iconEntrance 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    opacity: 0;
    transform: scale(0.3) rotate(-180deg);
    position: relative;
  }
  #app-icon {
    width: 100%;
    height: 100%;
    border-radius: 46px;
    overflow: hidden;
    background: linear-gradient(135deg, #8b5cf6, #3b82f6, #10b981);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #app-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* اگر عکس لود نشد، emoji نمایش داده می‌شود */
  #app-icon img:not([src]), #app-icon img[src=""] {
    display: none;
  }
  #app-icon-fallback {
    font-size: 100px;
    color: white;
    text-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  #start-title {
    font-size: 32px;
    font-weight: 900;
    color: #fbbf24;
    text-shadow: 0 3px 10px rgba(0,0,0,0.5), 0 0 30px rgba(251,191,36,0.6);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeSlideIn 0.8s ease 1s forwards;
    margin: 0;
    text-align: center;
  }
  @keyframes fadeSlideIn {
    to { opacity: 1; transform: translateY(0); }
  }

  #start-rules {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 500px;
    padding: 0 20px;
  }
  .rule-line {
    font-size: 22px;
    font-weight: 900;
    padding: 14px 24px;
    border-radius: 16px;
    text-align: center;
    opacity: 0;
    transform: translateX(-100vw);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .rule-good {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    animation: wipeIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.8s forwards;
    border: 2px solid rgba(255,255,255,0.4);
  }
  .rule-bad {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: white;
    animation: wipeIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 2.5s forwards;
    border: 2px solid rgba(255,255,255,0.4);
  }
  @keyframes wipeIn {
    0% { opacity: 0; transform: translateX(-100vw); }
    60% { opacity: 1; transform: translateX(20px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  #start-btn {
    padding: 18px 50px;
    font-size: 26px;
    font-family: inherit;
    font-weight: 900;
    background: linear-gradient(135deg, #fbbf24, #f59e0b, #f97316);
    color: white;
    border: 3px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    cursor: pointer;
    box-shadow:
      0 8px 0 #b45309,
      0 15px 30px rgba(251,191,36,0.5);
    opacity: 0;
    transform: scale(0.5) translateY(20px);
    animation: buttonEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 3.3s forwards;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  #start-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shine 2s ease-in-out infinite 4s;
  }
  @keyframes shine {
    0% { left: -100%; }
    50% { left: 100%; }
    100% { left: 100%; }
  }
  @keyframes buttonEntrance {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  #start-btn:active {
    transform: scale(0.96) translateY(4px) !important;
    box-shadow: 0 4px 0 #b45309, 0 8px 20px rgba(251,191,36,0.5);
  }

  /* ================== کادر قهرمان ================== */
  #champion-box {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
    border: 6px solid #fff;
    border-radius: 30px;
    padding: 30px 40px;
    box-shadow:
      0 0 0 6px #fbbf24,
      0 20px 60px rgba(251,191,36,0.6),
      inset 0 -8px 20px rgba(0,0,0,0.15),
      inset 0 8px 20px rgba(255,255,255,0.4);
    margin-bottom: 25px;
    animation: championPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90%;
  }
  #champion-box.show { display: flex; }
  @keyframes championPop {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  #champion-box .trophy {
    font-size: 64px; margin-bottom: 10px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    animation: trophyBounce 1.5s ease-in-out infinite;
  }
  @keyframes trophyBounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-8px) rotate(5deg); }
  }
  #champion-box .title {
    font-size: 28px; color: #7c2d12; font-weight: 900;
    margin-bottom: 12px;
    text-shadow: 0 2px 0 rgba(255,255,255,0.6);
  }
  #champion-box .score-text {
    font-size: 22px; color: #7c2d12; font-weight: 900; margin-bottom: 8px;
  }
  #champion-box .score-big {
    font-size: 54px; color: #dc2626; font-weight: 900;
    text-shadow: 0 3px 0 #fff, 0 6px 15px rgba(220,38,38,0.5);
    line-height: 1;
  }

  .delay-message {
    position: absolute; inset: 0; z-index: 180;
    display: none; align-items: center; justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.4);
    color: white; text-align: center;
    opacity: 0; transition: opacity 1s;
  }
  .delay-message.active { display: flex; opacity: 1; }
  .delay-message h1 {
    font-size: 48px; margin-bottom: 20px;
    text-shadow: 0 5px 15px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

<div id="game-container">
  <div class="sky"></div>
  <div class="sun-rays"></div>
  <div class="sun"></div>

  <div class="cloud cloud-1"><div class="cloud-shape"></div></div>
  <div class="cloud cloud-2"><div class="cloud-shape"></div></div>
  <div class="cloud cloud-3"><div class="cloud-shape"></div></div>
  <div class="cloud cloud-4"><div class="cloud-shape"></div></div>
  <div class="cloud cloud-5"><div class="cloud-shape"></div></div>
  <div class="cloud cloud-6"><div class="cloud-shape"></div></div>

  <div class="mountains-far"></div>
  <div class="mountains-near"></div>

  <div class="forest">
    <div class="tree"></div><div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div><div class="tree"></div>
  </div>

  <div class="river"></div>
  <div class="grass-ground"></div>
  <div class="flowers" id="flowers"></div>

  <div id="header">
    <div id="score-display">امتیاز: 0</div>
    <div id="lives-display"></div>
  </div>
  <div id="time-bar-container"><div id="time-bar"></div></div>

  <div id="castle-container">
    <div class="flag-pole"></div>
    <div class="flag-iran">
      <div class="flag-green"></div>
      <div class="flag-white"></div>
      <div class="flag-red"></div>
    </div>
    <div class="tower-left"></div>
    <div class="tower-right"></div>
    <div class="castle-body"></div>
    <div class="door"></div>
  </div>

  <div class="delay-message" id="delay-win"><h1>🏆 آفرین قهرمان! 🏆</h1></div>
  <div class="delay-message" id="delay-lose"><h1>💔 قلعه سقوط کرد! 💔</h1></div>

  <!-- ================== صفحه شروع ================== -->
  <div class="screen active" id="screen-start">
    <div id="start-content">
      <div id="app-icon-wrapper">
        <div id="app-icon">
          <img src="icon.png" alt="Farhan Castle"
               onerror="this.style.display='none'; this.parentElement.querySelector('#app-icon-fallback').style.display='block';">
          <span id="app-icon-fallback" style="display:none;">🏰</span>
        </div>
      </div>

      <h1 id="start-title">🏰 قلعه فرهان 🏰</h1>

      <div id="start-rules">
        <div class="rule-line rule-good">✅ روی کلمات خوب ضربه بزن تا برنده بشی</div>
        <div class="rule-line rule-bad">❌ روی کلمات بد ضربه نزن که می‌بازی</div>
      </div>

      <button id="start-btn" onclick="startGame()">شروع بازی</button>
    </div>
  </div>

  <!-- صفحه برد -->
  <div class="screen" id="screen-win">
    <div id="champion-box">
      <div class="trophy">🏆</div>
      <div class="title">قهرمان!</div>
      <div class="score-text">امتیاز تو:</div>
      <div class="score-big" id="final-score">0</div>
    </div>
    <h1 style="font-size: 26px;">یک سوال برای تو:</h1>
    <p id="win-question" style="color: #FBBF24; font-size: 22px; margin-bottom: 20px;"></p>
    <p style="color: #94a3b8; font-size: 18px; margin-bottom: 25px;">🎤 جوابت رو شفاهی به معلمت بگو</p>
    <button onclick="finishGame()">پایان</button>
  </div>

  <!-- صفحه باخت -->
  <div class="screen" id="screen-lose">
    <h1>💔 قلعه سقوط کرد! 💔</h1>
    <p>اشکالی نداره قهرمان! دوباره تلاش کن.</p>
    <button onclick="location.reload()">بازی مجدد</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('game-container');
  const scoreDisplay = document.getElementById('score-display');
  const livesDisplay = document.getElementById('lives-display');
  const timeBar = document.getElementById('time-bar');
  
  let score = 0; let lives = 3; let timeLeft = 40; let gameActive = false;
  let bubbles = []; let animationId; let lastTime = 0; let bubbleSpawnTimer = 0; let castleLineY = 0;
  let isFinalTenSeconds = false;
  let isInFirst20Seconds = true;
  let confettiInterval = null;
  let keepAliveTimer = null;

  // ====== کلمات مناسب کودکان ۶ تا ۱۰ سال ======
  const goodWords = [
    "مهربانی", "دوستی", "آفرین", "کمک کردن", "لبخند", "احترام",
    "همدلی", "فداکاری", "بخشش", "صداقت", "قول دادن", "گوش دادن",
    "تشکر کردن", "بغل کردن", "سلام کردن", "بازی کردن", "نقاشی",
    "کتاب خواندن", "دعا کردن", "احترام به بزرگتر", "صبر کردن",
    "قانون", "تمیزکاری", "شادی", "دلسوزی", "آرامش", "محبت",
    "وقت‌شناسی", "کمک به مامان", "کمک به بابا", "مهربان بودن",
    "خوب گوش دادن", "همکاری", "تعریف کردن", "زود خوابیدن",
    "دندان مسواک", "غذای سالم", "ورزش کردن", "آب خوردن",
    "کمک به دوست", "بازی منصفانه", "گفتن حقیقت", "عذر خواهی"
  ];
  const badWords = [
    "فحش", "کتک زدن", "مسخره", "احمق", "دعوا", "هل دادن",
    "داد زدن", "بی‌احترامی", "زورگویی", "دروغ", "فحش دادن",
    "تنها گذاشتن", "اذیت کردن", "آزار دادن", "شکستن",
    "غیبت کردن", "بدگویی", "دزدی", "خشن بودن", "ترساندن",
    "کشیدن مو", "تقلب", "بی‌ادبی", "قهر کردن", "جیغ زدن",
    "پرت کردن", "لگد زدن", "گاز گرفتن", "تف کردن", "بی‌نظمی",
    "چیز بد گفتن", "دروغ گفتن", "قانون شکنی", "بی احترامی"
  ];
  
  const winQuestions = [
    "وقتی دوستت ناراحت است، چه کار خوبی می‌توانی بکنی؟",
    "یک کلمه‌ی خوب که امروز یاد گرفتی چیست؟",
    "چرا دعوا کردن باعث می‌شود دوستانت ناراحت شوند؟",
    "چطور با کلمات خوب می‌توانیم دوستانمان را شاد کنیم؟"
  ];

  const firstPhaseColors = ['#FBBF24', '#4ADE80', '#3B82F6'];
  const allColors = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#06B6D4', '#F97316', '#84CC16', '#6366F1'];

  // ====== گلها ======
  (function createFlowers() {
    const container = document.getElementById('flowers');
    const colors = ['#f472b6', '#fbbf24', '#ef4444', '#a78bfa', '#fb923c', '#ffffff'];
    for (let i = 0; i < 40; i++) {
      const f = document.createElement('div');
      f.className = 'flower';
      f.style.left = Math.random() * 100 + '%';
      f.style.bottom = (Math.random() * 80) + '%';
      f.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      f.style.animationDelay = (Math.random() * 3) + 's';
      f.style.width = f.style.height = (4 + Math.random() * 5) + 'px';
      container.appendChild(f);
    }
  })();

  // ====== صداها ======
  const winSound = new Audio('win.mp3');
  const loseSound = new Audio('lose.mp3');
  const startMusic = new Audio('start.mp3');
  winSound.preload = 'auto';
  loseSound.preload = 'auto';
  startMusic.preload = 'auto';
  startMusic.loop = false;
  winSound.crossOrigin = 'anonymous';
  loseSound.crossOrigin = 'anonymous';
  startMusic.crossOrigin = 'anonymous';

  winSound.addEventListener('error', () => console.warn('⚠️ win.mp3 در دسترس نیست'));
  loseSound.addEventListener('error', () => console.warn('⚠️ lose.mp3 در دسترس نیست'));
  startMusic.addEventListener('error', () => console.warn('⚠️ start.mp3 در دسترس نیست'));

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  let audioUnlocked = false;
  function unlockAudio() {
      if (audioUnlocked) return;
      try {
          if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
          const buf = audioCtx.createBuffer(1, 1, 22050);
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          src.connect(audioCtx.destination);
          src.start(0);
          winSound.load();
          loseSound.load();
          startMusic.load();
          audioUnlocked = true;
          console.log('✅ Audio unlocked');
      } catch (e) {
          console.warn('unlockAudio error:', e);
      }
  }
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('touchstart', unlockAudio);
  document.addEventListener('click', unlockAudio);
  document.addEventListener('keydown', unlockAudio);

  function playDefaultSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    const now = audioCtx.currentTime;
    if (type === 'good') {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'bad') {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
        gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
    }
  }

  // ملودی داخلی خوش‌آمد (اگر start.mp3 نبود)
  function playWelcomeMelody() {
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
      const now = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];
      notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'triangle';
          const startTime = now + i * 0.18;
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.08, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
          osc.start(startTime);
          osc.stop(startTime + 0.4);
      });
  }

  // پخش آهنگ شروع
  function playStartMusic() {
      try {
          startMusic.volume = 0.6;
          startMusic.currentTime = 0;
          const p = startMusic.play();
          if (p && p.catch) {
              p.catch(() => {
                  console.log('start.mp3 پخش نشد — ملودی داخلی');
                  playWelcomeMelody();
              });
          }
      } catch (e) {
          playWelcomeMelody();
      }
  }

  function stopStartMusic() {
      try {
          startMusic.pause();
          startMusic.currentTime = 0;
      } catch(e) {}
  }

  function playSoundFile(audio, fallbackType) {
      if (!audio) { playDefaultSound(fallbackType); return; }
      try {
          audio.pause();
          audio.currentTime = 0;
          const p = audio.play();
          if (p && p.catch) {
              p.catch((err) => {
                  console.warn('audio.play failed:', err);
                  playDefaultSound(fallbackType);
              });
          }
      } catch (e) {
          console.warn('audio exception:', e);
          playDefaultSound(fallbackType);
      }
  }

  function startKeepAlive() {
      if (keepAliveTimer) clearInterval(keepAliveTimer);
      keepAliveTimer = setInterval(() => {
          document.body.style.opacity = document.body.style.opacity === '0.999' ? '1' : '0.999';
      }, 150);
  }
  function stopKeepAlive() {
      if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
      document.body.style.opacity = '1';
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fa-IR'; utterance.rate = 1.0; utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        } catch(e) { console.warn('speak error:', e); }
    }
  }

  function startConfettiBlast() {
    let count = 0;
    if (confettiInterval) clearInterval(confettiInterval);
    confettiInterval = setInterval(() => {
        for (let i = 0; i < 10; i++) {
            createOneConfetti(window.innerWidth * 0.25);
            createOneConfetti(window.innerWidth * 0.5);
            createOneConfetti(window.innerWidth * 0.75);
        }
        count++;
        if (count >= 80) {
            clearInterval(confettiInterval);
            confettiInterval = null;
        }
    }, 100);
  }

  function createOneConfetti(startX) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = startX + 'px';
      confetti.style.top = '50px';
      confetti.style.backgroundColor = allColors[Math.floor(Math.random() * allColors.length)];
      confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      const xMove = (Math.random() - 0.5) * window.innerWidth;
      const duration = 2 + Math.random() * 1.5;
      confetti.animate([
          { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
          { transform: `translate(${xMove}px, 105vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], {
          duration: duration * 1000,
          easing: 'cubic-bezier(.37,0,.63,1)',
          fill: 'forwards'
      });
      canvas.appendChild(confetti);
      setTimeout(() => confetti.remove(), duration * 1000 + 500);
  }

  function updateLivesUI() {
    livesDisplay.innerHTML = '';
    for(let i=0; i<3; i++) {
      let span = document.createElement('span');
      span.className = 'heart';
      span.innerText = i < lives ? '❤️' : '🖤';
      span.style.animationDelay = (i * 0.2) + 's';
      livesDisplay.appendChild(span);
    }
  }

  function startGame() {
    unlockAudio();
    stopStartMusic(); // توقف آهنگ شروع
    document.getElementById('screen-start').classList.remove('active');
    score = 0; lives = 3;
    updateLivesUI(); scoreDisplay.innerText = 'امتیاز: 0';
    castleLineY = window.innerHeight - 120;
    resetRound();
  }

  function resetRound() {
    bubbles.forEach(b => b.element.remove()); bubbles = [];
    timeLeft = 40; timeBar.style.width = '100%';
    timeBar.style.background = 'linear-gradient(90deg, #10b981, #22c55e, #4ade80)';
    bubbleSpawnTimer = 0; gameActive = true;
    isFinalTenSeconds = false;
    isInFirst20Seconds = true;
    lastTime = performance.now();
    if (animationId) cancelAnimationFrame(animationId);
    gameLoop(lastTime);
  }

  function spawnBubble() {
    const isGood = Math.random() > 0.55;
    const word = isGood ? goodWords[Math.floor(Math.random() * goodWords.length)] : badWords[Math.floor(Math.random() * badWords.length)];
    const size = 100 + Math.random() * 30;
    const x = Math.random() * (window.innerWidth - size);

    const el = document.createElement('div');
    el.className = 'bubble';

    let randomColor;
    if (isInFirst20Seconds) {
        randomColor = firstPhaseColors[Math.floor(Math.random() * firstPhaseColors.length)];
    } else {
        randomColor = allColors[Math.floor(Math.random() * allColors.length)];
    }
    el.style.background = `radial-gradient(circle at 30% 30%, ${randomColor}dd, ${randomColor})`;
    el.style.border = '3px solid rgba(255,255,255,0.7)';

    el.style.width = size + 'px'; el.style.height = size + 'px';
    el.style.left = x + 'px'; el.style.top = '-150px';
    el.innerText = word;
    el.style.fontSize = Math.max(14, size / 5) + 'px';

    let baseSpeed = 1.5 + Math.random() * 0.8;
    if (isFinalTenSeconds) baseSpeed *= 0.85;

    const bubble = { element: el, x: x, y: -150, size: size, speed: baseSpeed, isGood: isGood, isDead: false };

    el.onpointerdown = (e) => {
        e.preventDefault();
        if (!gameActive || bubble.isDead) return;
        bubble.isDead = true; el.remove();

        if (isGood) {
            score += 10; scoreDisplay.innerText = 'امتیاز: ' + score;
            playDefaultSound('good');
        } else {
            lives--; updateLivesUI(); playDefaultSound('bad');
            if (lives <= 0) endGame(false);
        }
        bubbles = bubbles.filter(b => b !== bubble);
    };

    canvas.appendChild(el); bubbles.push(bubble);
  }

  function gameLoop(timestamp) {
    if (!gameActive) return;
    const dt = (timestamp - lastTime) / 1000; lastTime = timestamp;
    timeLeft -= dt; let percent = (timeLeft / 40) * 100;
    if(percent < 0) percent = 0;
    timeBar.style.width = percent + '%';

    if (timeLeft <= 20 && isInFirst20Seconds) {
        isInFirst20Seconds = false;
    }

    if (timeLeft <= 10 && !isFinalTenSeconds) {
        isFinalTenSeconds = true;
        timeBar.style.background = 'linear-gradient(90deg, #ef4444, #dc2626, #b91c1c)';
    }

    if (timeLeft <= 0) { endGame(true); return; }

    bubbleSpawnTimer += dt;
    if (bubbleSpawnTimer > 1.4) { spawnBubble(); bubbleSpawnTimer = 0; }

    for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (b.isDead) continue;
        b.y += b.speed * dt * 60;
        b.element.style.top = b.y.toFixed(1) + 'px';

        if (b.y + b.size > castleLineY) {
            b.isDead = true; b.element.remove();
            bubbles.splice(i, 1);
            continue;
        }
    }
    animationId = requestAnimationFrame(gameLoop);
  }

  function endGame(isTimeUp) {
    gameActive = false;
    if (animationId) { cancelAnimationFrame(animationId); animationId = null; }

    if (!isTimeUp) {
        document.getElementById('delay-lose').classList.add('active');
        startKeepAlive();
        playSoundFile(loseSound, 'bad');
        speak("دوباره تلاش کن قهرمان");

        setTimeout(() => {
            stopKeepAlive();
            document.getElementById('delay-lose').classList.remove('active');
            bubbles.forEach(b => b.element.remove()); bubbles = [];
            document.getElementById('screen-lose').classList.add('active');
        }, 5000);
    } else {
        document.getElementById('delay-win').classList.add('active');
        startKeepAlive();
        playSoundFile(winSound, 'good');
        speak("آفرین قهرمان");
        startConfettiBlast();

        setTimeout(() => {
            stopKeepAlive();
            bubbles.forEach(b => b.element.remove()); bubbles = [];
            document.getElementById('delay-win').classList.remove('active');

            const screenWin = document.getElementById('screen-win');
            screenWin.classList.add('active');
            document.getElementById('final-score').innerText = score;
            document.getElementById('champion-box').classList.add('show');

            const q = winQuestions[Math.floor(Math.random() * winQuestions.length)];
            document.getElementById('win-question').innerText = q;
        }, 8000);
    }
  }

  function finishGame() {
    if (window.Capacitor && window.Capacitor.Plugins.App) {
        window.Capacitor.Plugins.App.exitApp();
    } else {
        alert("آفرین قهرمان! 🎉\nامتیاز تو: " + score);
        location.reload();
    }
  }

  // ====== راه‌اندازی اولیه ======
  window.addEventListener('load', () => {
    fetch('win.mp3', { method: 'HEAD' })
        .then(r => console.log(r.ok ? '✅ win.mp3 موجود است' : '❌ win.mp3 یافت نشد'))
        .catch(() => {});
    fetch('lose.mp3', { method: 'HEAD' })
        .then(r => console.log(r.ok ? '✅ lose.mp3 موجود است' : '❌ lose.mp3 یافت نشد'))
        .catch(() => {});
    fetch('start.mp3', { method: 'HEAD' })
        .then(r => console.log(r.ok ? '✅ start.mp3 موجود است' : '❌ start.mp3 یافت نشد'))
        .catch(() => {});
    fetch('icon.png', { method: 'HEAD' })
        .then(r => console.log(r.ok ? '✅ icon.png موجود است' : '❌ icon.png یافت نشد'))
        .catch(() => {});

    // آهنگ شروع با اولین لمس کاربر پخش می‌شود (به‌دلیل autoplay block)
    const tryPlayStart = () => {
        playStartMusic();
        document.removeEventListener('pointerdown', tryPlayStart);
        document.removeEventListener('touchstart', tryPlayStart);
        document.removeEventListener('click', tryPlayStart);
    };
    document.addEventListener('pointerdown', tryPlayStart);
    document.addEventListener('touchstart', tryPlayStart);
    document.addEventListener('click', tryPlayStart);
  });
</script>
</body>
